# Build, test and publish to GitHub Pages on every push to main (docs/SPEC.md §2.7).
# Tests that need private/ skip themselves here; the synthetic-data tests (including offline) run.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests (Vitest + Playwright)
        run: npm test
        env:
          CI: true

      - name: Check the Supabase settings are present
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in https://*.supabase.co|https://*.supabase.co/) ;; *) echo "::error::VITE_SUPABASE_URL should look like https://<project>.supabase.co"; exit 1;; esac
          # The anon key names its project: catch a URL and key from different projects (or a typo in the URL).
          node -e '
            const url = process.env.VITE_SUPABASE_URL, key = process.env.VITE_SUPABASE_ANON_KEY;
            const host = new URL(url).hostname.split(".")[0];
            const parts = key.split(".");
            if (parts.length !== 3) process.exit(0);           // newer publishable keys carry no project name
            const ref = JSON.parse(Buffer.from(parts[1], "base64url")).ref;
            if (ref && ref !== host) { console.log(`::error::VITE_SUPABASE_URL points at project "${host}" but the anon key belongs to "${ref}". Fix the URL secret.`); process.exit(1); }
            console.log("Supabase URL and anon key belong to the same project.");'

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
