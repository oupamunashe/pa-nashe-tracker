<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6B5C">
<title>Pa-Nashe Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface2:#F6F8F6; --ink:#16302A; --muted:#5B6F69; --faint:#8A9A95; --line:#D6DFDA;
  --brand:#1F6B5C; --brand-ink:#FFFFFF; --brand-soft:#DCEBE6;
  --pp:#dfc5fe; --pp-ink:#4B2A78; --pp-soft:#F1E6FF; --mm:#ae8774; --mm-ink:#3B261C; --mm-soft:#EADFD9; --jt:#4F6D7A; --jt-soft:#E1EAEE;
  --good:#2E7A4E; --good-soft:#DFF0E5; --bad:#B4432F; --bad-soft:#F7E1DB; --warn:#9A6A12; --warn-soft:#F6EBD3;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --shadow:0 1px 2px rgba(22,48,42,.06),0 6px 18px rgba(22,48,42,.06);
  --font-d:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1A17; --surface:#16241F; --surface2:#1B2C27; --ink:#E4EEEA; --muted:#A3B5AF; --faint:#7C8E88; --line:#2A3D37;
  --brand:#5FB8A3; --brand-ink:#0D1A16; --brand-soft:#1F3A33;
  --pp:#dfc5fe; --pp-ink:#2E1A4A; --pp-soft:#3A2E4A; --mm:#ae8774; --mm-ink:#2A1A12; --mm-soft:#3D2F29; --jt:#9DB8C4; --jt-soft:#22323A;
  --good:#6CC394; --good-soft:#1C3527; --bad:#EE8B76; --bad-soft:#3E211B; --warn:#E3B45A; --warn-soft:#3A2E16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1A17; --surface:#16241F; --surface2:#1B2C27; --ink:#E4EEEA; --muted:#A3B5AF; --faint:#7C8E88; --line:#2A3D37;
  --brand:#5FB8A3; --brand-ink:#0D1A16; --brand-soft:#1F3A33;
  --pp:#dfc5fe; --pp-ink:#2E1A4A; --pp-soft:#3A2E4A; --mm:#ae8774; --mm-ink:#2A1A12; --mm-soft:#3D2F29; --jt:#9DB8C4; --jt-soft:#22323A;
  --good:#6CC394; --good-soft:#1C3527; --bad:#EE8B76; --bad-soft:#3E211B; --warn:#E3B45A; --warn-soft:#3A2E16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark; }

*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.num,.amt{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-d);letter-spacing:-.01em;margin:0}
h1{font-size:1.65rem;line-height:1.15;font-weight:700}
h2{font-size:1.15rem;font-weight:650}
h3{font-size:1rem;font-weight:650}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.rail{display:none}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brandmark{font-family:var(--font-d);font-weight:750;font-size:1.05rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brandmark .dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--pp) 0 50%,var(--mm) 50% 100%);flex:none}
.monthsw{margin-left:auto;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.monthsw button{border:0;background:transparent;border-radius:999px;min-width:34px;height:34px;cursor:pointer;font-weight:600}
.monthsw button:hover{background:var(--surface2)}
.monthsw .lbl{padding:0 6px;font-weight:650;font-family:var(--font-d);min-width:118px;text-align:center;white-space:nowrap}
.monthsw:empty{display:none}
@media (max-width:440px){.topbar .brandmark{font-size:0;gap:0}.monthsw .lbl{min-width:96px;font-size:.92rem}.who .small{display:none}.who{padding:0 6px}.topbar-in{padding:8px 12px;gap:8px}}
.who{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;padding:0 10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
main{width:100%;max-width:1080px;margin:0 auto;padding:16px 16px 120px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:6px 0;cursor:pointer}
.tabbar button[aria-current="page"]{color:var(--brand);font-weight:700}
.tabbar svg{width:22px;height:22px}
.tabbar .capture{width:62px;height:62px;border-radius:50%;background:var(--brand);color:var(--brand-ink);border:4px solid var(--bg);margin:-28px auto 0;display:grid;place-items:center;box-shadow:0 6px 20px color-mix(in srgb,var(--brand) 45%,transparent);cursor:pointer}
.tabbar .capture svg{width:28px;height:28px}
.tabbar .cap-wrap{display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--brand);font-weight:700;gap:2px}
@media (min-width:980px){
  .tabbar{display:none}
  .rail{display:flex;flex-direction:column;width:232px;flex:none;position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .rail .brandmark{padding:4px 8px 18px;font-size:1.15rem}
  .rail nav{display:flex;flex-direction:column;gap:2px}
  .rail nav button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:600;cursor:pointer}
  .rail nav button:hover{background:var(--surface2);color:var(--ink)}
  .rail nav button[aria-current="page"]{background:var(--brand-soft);color:var(--ink)}
  .rail nav svg{width:19px;height:19px}
  .rail .capture-big{margin:4px 0 18px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;padding:13px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:1rem}
  .rail .capture-big svg{width:20px;height:20px}
  .topbar .brandmark{display:none}
  main{padding:22px 28px 60px}
}

/* ---------- building blocks ---------- */
.stack>*+*{margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.right{text-align:right}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
.grid3{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:720px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:.86rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:650;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.P{background:var(--pp);color:var(--pp-ink);border-color:transparent}
.chip.M{background:var(--mm);color:var(--mm-ink);border-color:transparent}
.chip.J,.chip.U{background:var(--jt-soft);color:var(--jt);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar>span{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--brand)}
.bar>i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.empty{border:1px dashed var(--line);border-radius:var(--r-m);padding:22px;text-align:center;color:var(--muted)}
.notice{border-radius:var(--r-m);padding:12px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-weight:600;cursor:pointer;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- page heads ---------- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.pagehead p{margin:4px 0 0}

/* ---------- home hero ---------- */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:var(--r-l);padding:20px;position:relative;overflow:hidden}
.hero .lbl{opacity:.85;font-size:.9rem}
.hero .big{font-family:var(--font-d);font-size:2.6rem;font-weight:750;line-height:1;letter-spacing:-.02em;margin:6px 0 4px}
.hero .flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hero .flow div{background:color-mix(in srgb,var(--brand-ink) 12%,transparent);border-radius:12px;padding:10px}
.hero .flow b{display:block;font-family:var(--font-d);font-size:1.1rem}
.hero .flow span{font-size:.78rem;opacity:.85}
.hero .split{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:14px;background:color-mix(in srgb,var(--brand-ink) 18%,transparent)}
.hero .split span{display:block;height:100%}

/* ---------- lists ---------- */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;background:transparent;width:100%;border-left:0;border-right:0;border-bottom:0;text-align:left}
.li:first-child{border-top:0}
.li:hover{background:var(--surface2)}
.li .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:.8rem;color:var(--muted)}
.li .v{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.li .v small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:750;font-family:var(--font-d);flex:none;background:var(--surface2);color:var(--muted);font-size:.85rem}
.avatar.P{background:var(--pp);color:var(--pp-ink)} .avatar.M{background:var(--mm);color:var(--mm-ink)} .avatar.J{background:var(--jt-soft);color:var(--jt)}

/* ---------- budget table ---------- */
.sec-h{display:flex;align-items:baseline;gap:10px;padding:14px 14px 8px;font-family:var(--font-d);font-weight:700;font-size:1.05rem}
.sec-h .tot{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.95rem}
.grp{border-top:1px solid var(--line)}
.grp-h{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:9px 14px;background:var(--surface2);font-weight:650;font-size:.88rem;cursor:pointer}
.grp-h .n{display:flex;align-items:center;gap:6px}
.grp-h .chev{transition:transform .15s}
.grp[data-open="0"] .grp-h .chev{transform:rotate(-90deg)}
.grp[data-open="0"] .grp-b{display:none}
.bl{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.bl:hover{background:var(--surface2)}
.bl .n{min-width:0}
.bl .n .t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.bl .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.bl .num{text-align:right;font-variant-numeric:tabular-nums}
.bl .num small{display:block;font-size:.74rem}
.cols-h{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;padding:6px 14px;font-size:.76rem;color:var(--muted)}
.cols-h span:not(:first-child){text-align:right}
.progress-mini{height:4px;border-radius:99px;background:var(--surface2);margin-top:5px;overflow:hidden}
.progress-mini span{display:block;height:100%;background:var(--brand)}
.progress-mini.over span{background:var(--bad)}
@media (min-width:720px){.grp-h,.bl,.cols-h{grid-template-columns:1fr 110px 110px 110px}.only-wide{display:block}}
.only-wide{display:none}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.tbl thead th{color:var(--muted);font-weight:600;font-size:.78rem;background:var(--surface)}
.tbl tr.g td{background:var(--surface2);font-weight:700}
.tbl tr.g td:first-child{background:var(--surface2)}
.tbl tr.t td{font-weight:750;border-top:2px solid var(--line)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface2)}

/* ---------- forms & sheets ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label,.lab{font-size:.82rem;font-weight:650;color:var(--muted)}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-height:42px}
textarea.inp{min-height:70px;resize:vertical}
.inp:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.inp.sm{min-height:34px;padding:6px 9px;border-radius:8px}
.amtbox{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);padding:4px 0 8px;margin-bottom:14px}
.amtbox:focus-within{border-color:var(--brand)}
.amtbox span{font-family:var(--font-d);font-size:2rem;color:var(--muted);font-weight:600}
.amtbox input{border:0;background:transparent;font-family:var(--font-d);font-size:2.4rem;font-weight:700;width:100%;outline:0;font-variant-numeric:tabular-nums}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;border-radius:var(--r-l) var(--r-l) 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{padding:16px;overflow-y:auto;flex:1}
.sheet-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:var(--r-l);max-height:86vh}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.picker{border:1px solid var(--line);border-radius:12px;max-height:280px;overflow-y:auto}
.picker .pg{font-size:.74rem;color:var(--muted);font-weight:700;padding:8px 12px 4px;background:var(--surface2);position:sticky;top:0}
.picker button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;cursor:pointer;gap:8px;align-items:center}
.picker button:hover,.picker button[aria-selected="true"]{background:var(--brand-soft)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.quick button{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:.86rem}
.quick button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.splitrow{display:grid;grid-template-columns:96px 1fr 84px 34px;gap:6px;margin-bottom:6px;align-items:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90;font-weight:600;box-shadow:var(--shadow);max-width:92vw;animation:up .2s}
.toast.bad{background:var(--bad);color:#fff}
@media (min-width:980px){.toast{bottom:30px}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.kpi b{display:block;font-family:var(--font-d);font-size:1.25rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.person{border-radius:var(--r-m);padding:16px;border:1px solid var(--line);background:var(--surface)}
.person.P{border-top:6px solid var(--pp)} .person.M{border-top:6px solid var(--mm)} .person.U{border-top:4px solid var(--jt)}
.person .big{font-family:var(--font-d);font-size:1.8rem;font-weight:750;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center;padding:20px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.imp-row{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
@media (min-width:720px){.imp-row{grid-template-columns:90px 1fr 110px 150px 200px;align-items:center}}
.hide{display:none!important}

.kpi{min-width:0}.kpi b{overflow-wrap:anywhere}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sheet .kpi{padding:10px}.sheet .kpi b{font-size:1.02rem}
.splitrow.alloc{grid-template-columns:120px 1fr 120px 52px 32px}
@media (max-width:560px){.splitrow.alloc{grid-template-columns:1fr 1fr 48px 32px}.splitrow.alloc .lbl{grid-column:1/-1;grid-row:2}}

</style>
</head>
<body>
<script>
/* ===================== Pa-Nashe Tracker · core ===================== */
const GROUPS = [
  { k: 'earned', n: 'Earned Income', sec: 'in' },

/* ---------------- database layer ---------------- */
const queues = {};
function enqueue(path, fn) {
  const p = (queues[path] || Promise.resolve()).then(fn, fn);
  queues[path] = p.catch(() => {});
  return p;
}
async function dbWrite(path, op, data) {
  if (!S.db) { toast('Not connected – open this from claude.ai to save.', 'bad'); throw new Error('offline'); }
  if (!S.canWrite) { toast('You have view-only access to this tracker.', 'bad'); throw new Error('readonly'); }
  return enqueue(path, async () => {
    try { await S.db.doc(path)[op](data); }
    catch (e) {
      if (e?.code === 'invalid_argument' && /permission|write|level/i.test(e.message || '')) S.canWrite = false;
      if (e?.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return S.db.doc(path)[op](data); }
      toast('Could not save: ' + (e?.message || e?.code || 'unknown error'), 'bad');
      throw e;
    }
  });
}
async function ensureMonth(k, extra = {}) {
  if (S.months[k]) return;
  const body = { y: +k.slice(0, 4), m: +k.slice(5, 7), lines: {}, txns: {}, ledger: {}, ...extra };
  S.months[k] = body; S.ver++;
  await dbWrite('months/' + k, 'set', body);
}
async function saveTxn(t, id = uid(), oldMonth = null) {
  const k = t.mo;
  if (oldMonth && oldMonth !== k) await deleteTxn(oldMonth, id);
  if (!S.months[k]) await ensureMonth(k, { txns: { [id]: t } });
  else await dbWrite('months/' + k, 'update', { txns: { [id]: t } });
  return id;
}
async function deleteTxn(k, id) { await dbWrite('months/' + k, 'update', { txns: { [id]: null } }); }
async function saveLine(k, itemId, line) {
  await ensureMonth(k);
  await dbWrite('months/' + k, 'update', { lines: { [itemId]: line } });
}
async function removeLine(k, itemId) { await dbWrite('months/' + k, 'update', { lines: { [itemId]: null } }); }
async function saveLedger(e, id = uid()) {
  if (!e.at) e = { ...e, at: Date.now() };
  const k = mkey(e.d);
  if (!S.months[k]) await ensureMonth(k, { ledger: { [id]: e } });
  else await dbWrite('months/' + k, 'update', { ledger: { [id]: e } });
  return id;
}
async function deleteLedger(k, id) { await dbWrite('months/' + k, 'update', { ledger: { [id]: null } }); }
async function saveItem(id, item) { await dbWrite('config/catalog', 'update', { items: { [id]: item } }); }
async function saveAccount(id, a) { await dbWrite('config/accounts', 'update', { accounts: { [id]: a } }); }
async function saveMain(patch) { await dbWrite('config/main', 'update', patch); }
async function saveMs(id, patch, full = false) { await dbWrite('milestones/' + id, full ? 'set' : 'update', patch); }

function subscribe() {
  const onErr = what => e => { console.warn(what, e); if (e?.code === 'revoked') { S.offline = true; render(); } };
  S.db.collection('config').onSnapshot(snap => {
    snap.docs.forEach(d => { S.cfg[d.id] = d.exists ? d.data() : null; });
    S.loaded.config = true; S.ver++; scheduleRender();
  }, onErr('config'));
  S.db.collection('months').onSnapshot(snap => {
    const seen = {};
    snap.docs.forEach(d => { if (d.exists) { S.months[d.id] = d.data(); seen[d.id] = 1; } });
    Object.keys(S.months).forEach(k => { if (!seen[k]) delete S.months[k]; });
    S.loaded.months = true; S.ver++; scheduleRender();
  }, onErr('months'));
  S.db.collection('milestones').onSnapshot(snap => {
    S.ms = {}; snap.docs.forEach(d => { if (d.exists) S.ms[d.id] = d.data(); });
    S.loaded.ms = true; S.ver++; scheduleRender();
  }, onErr('milestones'));
}

/* ---------------- month calculations ---------------- */
const liveTxns = doc => Object.entries(doc?.txns || {}).filter(([, t]) => t && t.it).map(([id, t]) => ({ id, ...t }));
const liveLedger = doc => Object.entries(doc?.ledger || {}).filter(([, e]) => e && e.a).map(([id, e]) => ({ id, ...e }));
const FUND_ACC = a => a && ['savings', 'goal', 'credit', 'loan'].includes(a.t);

function monthCalc(k) {
  return cached('m:' + k, () => {
    const doc = S.months[k] || { lines: {}, txns: {} };
    const txns = liveTxns(doc);
    const ids = new Set(Object.keys(doc.lines || {}).filter(i => doc.lines[i]));
    txns.forEach(t => ids.add(t.it));
    const lines = [...ids].map(id => {
      const it = cat()[id] || { n: '(removed line item)', g: 'onceoff', o: 9999 };
      const L = (doc.lines || {})[id] || {};
      const tx = txns.filter(t => t.it === id).sort((a, b) => (b.d || '').localeCompare(a.d || ''));
      return { id, it, g: it.g, k: kindOf(it.g), b: +L.b || 0, act: r2(sum(tx, t => t.amt)), tx, al: L.al || [], rec: !!L.rec, paid: !!L.paid, note: L.note || '', inMonth: !!(doc.lines || {})[id] };
    }).sort((a, b) => (GMAP[a.g]?.i ?? 99) - (GMAP[b.g]?.i ?? 99) || (a.it.o || 0) - (b.it.o || 0));
    const auto = {};
    txns.forEach(t => {
      if (itemKind(t.it) === 'in' || !t.pay) return;
      const a = accs()[t.pay]; if (!FUND_ACC(a)) return;
      auto[t.pay] = r2((auto[t.pay] || 0) + (+t.amt || 0));
    });
    const T = { b: {}, a: {} };
    ['earned', 'funding', 'sav', 'exp'].forEach(x => { T.b[x] = 0; T.a[x] = 0; });
    const G = {};
    lines.forEach(l => {
      const key = l.k === 'in' ? l.g : l.k;
      T.b[key] += l.b; T.a[key] += l.act;
      G[l.g] = G[l.g] || { b: 0, a: 0 }; G[l.g].b += l.b; G[l.g].a += l.act;
    });
    T.a.auto = r2(sum(Object.values(auto)));
    T.b.auto = 0;
    for (const x of ['b', 'a']) {
      T[x].income = r2(T[x].earned + T[x].funding + T[x].auto);
      T[x].out = r2(T[x].sav + T[x].exp);
      T[x].surplus = r2(T[x].income - T[x].out);
    }
    return { k, doc, lines, txns, auto, T, G };
  });
}

/* ---------------- allocation (Piepie / Munny) ---------------- */
function shares(line, total, basis) {
  // basis 'b' uses rand amounts as entered; 'a' scales rand amounts to the actual
  const out = { P: 0, M: 0, U: 0 };
  if (!total) return out;
  const al = line.al || [];
  if (!al.length) { out.U = total; return out; }
  const amtTotal = sum(al.filter(x => x.u === 'amt'), x => x.v);
  const scale = basis === 'a' && line.b ? total / line.b : 1;
  let used = 0;
  al.forEach(x => {
    const v = x.u === 'pct' ? total * (+x.v || 0) / 100 : (+x.v || 0) * (basis === 'a' ? scale : 1);
    out[x.w] = (out[x.w] || 0) + v; used += v;
  });
  if (basis === 'b' && amtTotal && !al.some(x => x.u === 'pct')) used = amtTotal;
  out.U = r2(total - used);
  if (Math.abs(out.U) < 0.01) out.U = 0;
  return out;
}
function peopleCalc(k, basis) {
  return cached('p:' + k + basis, () => {
    const mc = monthCalc(k);
    const R = { P: { inc: 0, out: 0, lines: [] }, M: { inc: 0, out: 0, lines: [] }, U: { inc: 0, out: 0, lines: [] } };
    mc.lines.forEach(l => {
      const tot = basis === 'b' ? l.b : l.act;
      if (!tot) return;
      const sh = shares(l, tot, basis);
      ['P', 'M', 'U'].forEach(w => {
        if (!sh[w]) return;
        if (l.k === 'in') R[w].inc += sh[w]; else R[w].out += sh[w];
        R[w].lines.push({ l, v: r2(sh[w]) });
      });
    });
    if (basis === 'a') Object.entries(mc.auto).forEach(([aid, v]) => {
      const w = accs()[aid]?.ow; const who = w === 'P' || w === 'M' ? w : 'U';
      R[who].inc += v; R[who].lines.push({ l: { it: { n: 'Paid from ' + (accs()[aid]?.n || aid) + ' (auto)' }, k: 'in', id: 'auto-' + aid }, v });
    });
    Object.values(R).forEach(x => { x.inc = r2(x.inc); x.out = r2(x.out); x.left = r2(x.inc - x.out); });
    return R;
  });
}

/* ---------------- account balances ---------------- */
function balances() {
  return cached('bal', () => {
    const A = accs(), R = {};
    Object.entries(A).forEach(([id, a]) => { R[id] = { id, a, ev: [] }; });
    for (const k of monthKeys()) {
      const doc = S.months[k];
      liveTxns(doc).forEach(t => {
        const it = cat()[t.it]; if (!it) return;
        (it.fl || []).forEach(f => {
          const a = A[f.a]; if (!a || a.bf === false) return;
          R[f.a].ev.push({ d: t.d, at: t.at || 0, amt: r2(f.x * f.s * t.amt), ds: it.n + (t.store ? ' · ' + t.store : ''), src: 'budget', mo: k, tid: t.id });
        });
        if (t.pay && A[t.pay]) {
          const a = A[t.pay]; const dir = itemKind(t.it) === 'in' ? 1 : -1;
          R[t.pay].ev.push({ d: t.d, at: t.at || 0, amt: r2((isLiab(a) ? -dir : dir) * t.amt), ds: (t.store || it.n) + (dir < 0 ? '' : ' (received)'), src: 'paid', mo: k, tid: t.id });
        }
      });
      liveLedger(doc).forEach(e => { if (R[e.a]) R[e.a].ev.push({ d: e.d, at: e.at || 0, amt: +e.amt || 0, ds: e.ds, ty: e.ty, bal: e.bal, src: e.src || 'ledger', mo: k, lid: e.id }); });
    }
    Object.values(R).forEach(r => {
      const a = r.a;
      const od = a.od || '0000';
      r.ev = r.ev.filter(e => (e.d || '') >= od).sort((x, y) => (x.d || '').localeCompare(y.d || '') || (x.at || 0) - (y.at || 0) || (x.ty === 'check') - (y.ty === 'check'));
      let known = a.open !== null && a.open !== undefined, bal = known ? +a.open : 0, delta = 0, lastCheck = null;
      r.ev.forEach(e => {
        if (e.ty === 'check') { e.adj = known ? r2(e.bal - bal) : null; bal = +e.bal; known = true; lastCheck = e; }
        else { bal = r2(bal + e.amt); delta = r2(delta + e.amt); }
        e.run = known ? r2(bal) : null;
      });
      r.known = known; r.bal = known ? r2(bal) : null; r.delta = delta; r.lastCheck = lastCheck;
      r.needsCheck = !!a.chk && !lastCheck && !a.closed;
      r.ev.reverse();
    });
    return R;
  });
}

/* ---------------- plan / scenarios ---------------- */
function planCalc(k, sid) {
  return cached('plan:' + k + sid, () => {
    const m = main(); const sc = m.scen?.[sid] || { b: {} }; const base = +m.planBase || 0;
    const mc = monthCalc(k);
    const lavieRent = sum(mc.lines.filter(l => /^la vie rentals?$/i.test(l.it.n)), l => l.act);
    const actBase = r2(mc.T.a.earned - lavieRent);
    const act = {};
    BUCKETS.forEach(b => act[b.k] = 0);
    mc.lines.forEach(l => { if (l.it.pb && act[l.it.pb] !== undefined) act[l.it.pb] += l.act; });
    act.lavie -= lavieRent;
    const rows = BUCKETS.map(b => {
      const [p, fx] = sc.b?.[b.k] || [0, 0];
      const plan = r2(p * base + (+fx || 0));
      const a = r2(act[b.k]);
      let status;
      if (!actBase) status = 'No actual yet';
      else if (b.save) status = a >= plan ? 'On target' : 'Below target';
      else status = a <= plan ? 'Within plan' : 'Over plan';
      return { ...b, plan, planPct: base ? plan / base : 0, act: a, actPct: actBase ? a / actBase : 0, diff: r2(a - plan), status };
    });
    const cats = SUMCATS.map(c => {
      const rs = rows.filter(r => r.cat === c.k);
      const plan = sum(rs, r => r.plan), a = sum(rs, r => r.act);
      return { ...c, plan, act: a, planPct: base ? plan / base : 0, actPct: actBase ? a / actBase : 0, save: c.k === 'savings' };
    });
    const saved = cats[0].act, drawn = r2(mc.T.a.funding + mc.T.a.auto);
    return { base, actBase, rows, cats, planTotal: sum(rows, r => r.plan), actTotal: sum(rows, r => r.act), drawn, net: r2(saved - drawn), netRate: actBase ? (saved - drawn) / actBase : 0, savePlan: cats[0].plan, saveRate: actBase ? saved / actBase : 0 };
  });
}
const pmt = (rate, n, pv) => rate ? pv * rate / (1 - Math.pow(1 + rate, -n)) : pv / n;

/* ---------------- year aggregation ---------------- */
function yearCalc(y) {
  return cached('y:' + y, () => {
    const keys = MONTHS.map((_, i) => y + '-' + String(i + 1).padStart(2, '0'));
    const items = {}; const tot = keys.map(() => ({ b: { earned: 0, funding: 0, auto: 0, sav: 0, exp: 0, income: 0, out: 0, surplus: 0 }, a: { earned: 0, funding: 0, auto: 0, sav: 0, exp: 0, income: 0, out: 0, surplus: 0 } }));
    keys.forEach((k, i) => {
      if (!S.months[k]) return;
      const mc = monthCalc(k);
      tot[i] = mc.T;
      mc.lines.forEach(l => {
        items[l.id] = items[l.id] || { id: l.id, it: l.it, g: l.g, b: Array(12).fill(0), a: Array(12).fill(0) };
        items[l.id].b[i] += l.b; items[l.id].a[i] += l.act;
      });
    });
    return { y, keys, items: Object.values(items).sort((a, b) => (GMAP[a.g]?.i ?? 99) - (GMAP[b.g]?.i ?? 99) || (a.it.o || 0) - (b.it.o || 0)), tot };
  });
}

/* ---------------- milestones ---------------- */
function msCalc(id) {
  return cached('ms:' + id, () => {
    const m = S.ms[id]; if (!m) return null;
    const rate = +m.usd || 0;
    const toZ = (amt, cur) => cur === 'USD' ? (+amt || 0) * rate : (+amt || 0);
    const tx = Object.entries(m.txns || {}).filter(([, t]) => t).map(([tid, t]) => ({ id: tid, ...t, zar: toZ(t.amt, t.cur) }));
    const lines = Object.entries(m.lines || {}).filter(([, l]) => l).map(([lid, l]) => {
      const lt = tx.filter(t => t.l === lid);
      return { id: lid, ...l, bz: toZ(l.b, l.cur), az: r2(sum(lt, t => t.zar)), tx: lt };
    }).sort((a, b) => (a.sec === b.sec ? 0 : a.sec === 'income' ? -1 : 1) || (a.o || 0) - (b.o || 0));
    const inc = lines.filter(l => l.sec === 'income'), exp = lines.filter(l => l.sec !== 'income');
    return { m, rate, lines, tx, inc: { b: sum(inc, l => l.bz), a: sum(inc, l => l.az) }, exp: { b: sum(exp, l => l.bz), a: sum(exp, l => l.az) } };
  });
}

const NAV = [
  ['home', 'Home', 'home'], ['budget', 'Budget', 'budget'], ['people', 'Piepie & Munny', 'people'], ['accounts', 'Accounts', 'acc'],
  ['plan', 'Plan', 'plan'], ['year', 'Year view', 'year'], ['milestones', 'Milestones', 'flag'], ['more', 'More', 'cog'],
];

let renderPending = false;
function scheduleRender() {
  if (renderPending) return; renderPending = true;
  requestAnimationFrame(() => {
    renderPending = false;
    const ae = document.activeElement;
    if (ae && $('#main')?.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) { S.deferRender = true; return; }
    render();
    refreshSheet();
  });
}
document.addEventListener('focusout', () => { if (S.deferRender) { S.deferRender = false; setTimeout(scheduleRender, 50); } });

function ready() { return S.loaded.config && S.loaded.months && S.loaded.ms; }
function curMonth() {
  const keys = monthKeys();
  if (!S.ui.month || !keys.includes(S.ui.month)) {
    const t = mkey(todayISO());
    S.ui.month = keys.includes(t) ? t : keys.filter(k => k <= t).pop() || keys[keys.length - 1] || t;
  }
  return S.ui.month;
}

function render() {
  const v = S.ui.view;
  $$('[data-a="nav"]').forEach(b => b.setAttribute('aria-current', b.dataset.v === v || (v === 'account' && b.dataset.v === 'accounts') || (v === 'milestone' && b.dataset.v === 'milestones') || (['people', 'plan', 'year', 'milestones', 'milestone'].includes(v) && b.dataset.v === 'more' && b.closest('.tabbar')) ? 'page' : 'false'));
  const who = $('#whobtn');
  if (who) who.innerHTML = S.me ? `<span class="avatar ${S.me}" style="width:26px;height:26px;border-radius:8px">${pname(S.me)[0]}</span><span class="small">${esc(pname(S.me))}</span>` : '<span class="small">Who are you?</span>';
  const main = $('#main');
  if (S.offline && !S.db) { main.innerHTML = offlineView(); $('#monthsw').innerHTML = ''; return; }
  if (!ready()) return;
  if (!S.cfg.main || !S.cfg.catalog) { main.innerHTML = `<div class="empty"><h2>Your tracker is empty</h2><p>The data hasn’t been loaded into this tracker yet. Ask Claude to load it, then reopen this page.</p></div>`; return; }
  const k = curMonth();
  const showMonth = ['home', 'budget', 'people', 'plan'].includes(v);
  const keys = monthKeys();
  $('#monthsw').innerHTML = showMonth ? `
    <button data-a="month" data-k="${prevKey(k)}" ${keys.includes(prevKey(k)) ? '' : 'disabled'} aria-label="Previous month">‹</button>
    <span class="lbl">${mName(k)}</span>
    <button data-a="month" data-k="${nextKey(k)}" ${keys.includes(nextKey(k)) ? '' : 'disabled'} aria-label="Next month">›</button>` : '';
  const views = { home: viewHome, budget: viewBudget, people: viewPeople, accounts: viewAccounts, account: viewAccount, plan: viewPlan, year: viewYear, milestones: viewMilestones, milestone: viewMilestone, more: viewMore, items: viewItems };
  main.innerHTML = (views[v] || viewHome)(k);
  if (S.ui.scrollTop) { window.scrollTo(0, 0); S.ui.scrollTop = false; }
}
function offlineView() {
  return `<div class="loading"><div style="max-width:440px"><h2>Open this from claude.ai</h2>
  <p class="muted">The Pa-Nashe Tracker keeps your data in a shared store that only works when the page is opened from its claude.ai link while you’re signed in.</p></div></div>`;
}

/* ---------- small renderers ---------- */
function allocChips(al) {
  if (!al || !al.length) return '';
  const tot = sum(al.filter(x => x.u === 'amt'), x => x.v);
  return al.map(x => `<span class="chip ${x.w}">${esc(pname(x.w))}${al.length > 1 ? ' ' + (x.u === 'pct' ? x.v + '%' : fmt0(x.v)) : ''}</span>`).join('');
}
function varCls(l) {
  if (!l.b && !l.act) return '';
  if (l.k === 'in' || l.k === 'sav') return l.act >= l.b ? 'pos' : (l.act ? 'neg' : 'faint');
  return l.act > l.b + 0.004 ? 'neg' : 'pos';
}
function lineRow(l, k) {
  const due = (l.rec || l.b) && !l.act && l.k !== 'in';
  const left = l.k === 'exp' ? l.b - l.act : l.act - l.b;
  const prog = l.b ? Math.min(100, l.act / l.b * 100) : (l.act ? 100 : 0);
  const over = l.k === 'exp' && l.act > l.b + 0.004;
  return `<div class="bl" data-a="line" data-k="${k}" data-id="${l.id}" role="button" tabindex="0">
    <div class="n"><span class="t">${esc(l.it.n)}</span>
      <div class="meta">${allocChips(l.al)}${l.rec ? '<span class="chip">Monthly</span>' : ''}${due && l.rec ? '<span class="chip warn">Due</span>' : ''}${l.tx.length > 1 ? `<span class="chip">${l.tx.length} entries</span>` : ''}</div>
      ${l.k === 'exp' && l.b ? `<div class="progress-mini ${over ? 'over' : ''}"><span style="width:${prog}%"></span></div>` : ''}
    </div>
    <div class="num">${l.b ? fmt(l.b) : '<span class="faint">–</span>'}</div>
    <div class="num ${varCls(l)}">${l.act ? fmt(l.act) : '<span class="faint">–</span>'}</div>
    <div class="num only-wide ${left < -0.004 ? 'neg' : 'muted'}">${l.b || l.act ? fmt(left) : ''}</div>
  </div>`;
}
function hbar(actPct, planPct, color = 'var(--brand)') {
  return `<div class="bar"><span style="width:${Math.max(0, Math.min(100, actPct * 100))}%;background:${color}"></span>${planPct ? `<i style="left:${Math.min(99.5, planPct * 100)}%"></i>` : ''}</div>`;
}

/* ---------- HOME ---------- */
function viewHome(k) {
  const mc = monthCalc(k), T = mc.T, pa = peopleCalc(k, 'a');
  const sid = main().scenario || '1', pl = planCalc(k, sid);
  const outs = pa.P.out + pa.M.out + pa.U.out || 1;
  const due = mc.lines.filter(l => l.k !== 'in' && (l.rec) && !l.act && l.b);
  const over = mc.lines.filter(l => l.k === 'exp' && l.b && l.act > l.b + 1).sort((a, b) => (b.act - b.b) - (a.act - a.b)).slice(0, 4);
  const bal = balances(), checks = Object.values(bal).filter(r => r.needsCheck);
  const recent = mc.txns.filter(t => t.src !== 'import').sort((a, b) => (b.at || 0) - (a.at || 0) || (b.d || '').localeCompare(a.d || '')).slice(0, 6);
  const hi = S.me ? 'Hi ' + esc(pname(S.me)) : 'Hello';
  return `<div class="stack">
  <div class="pagehead"><div><h1>${hi}</h1><p class="muted">${mName(k)} at a glance</p></div></div>
  <section class="hero">
    <div class="lbl">Left after savings and spending</div>
    <div class="big amt">${fmt(T.a.surplus)}</div>
    <div class="small" style="opacity:.85">Planned: ${fmt(T.b.surplus)}</div>
    <div class="flow">
      <div><span>Money in</span><b class="amt">${fmt0(T.a.income)}</b></div>
      <div><span>Saved</span><b class="amt">${fmt0(T.a.sav)}</b></div>
      <div><span>Spent</span><b class="amt">${fmt0(T.a.exp)}</b></div>
    </div>
    <div class="split" title="Who covered this month’s outgoings">
      <span style="width:${pa.P.out / outs * 100}%;background:var(--pp)"></span>
      <span style="width:${pa.M.out / outs * 100}%;background:var(--mm)"></span>
      <span style="width:${pa.U.out / outs * 100}%;background:color-mix(in srgb,var(--brand-ink) 45%,transparent)"></span>
    </div>
    <div class="row small" style="margin-top:6px;opacity:.9;gap:14px;flex-wrap:wrap">
      <span>${esc(pname('P'))} ${fmt0(pa.P.out)}</span><span>${esc(pname('M'))} ${fmt0(pa.M.out)}</span>${pa.U.out ? `<span>Not allocated ${fmt0(pa.U.out)}</span>` : ''}
    </div>
  </section>
  <div class="grid2">
    <section class="panel">
      <div class="panel-h"><h2>Still to pay</h2><span class="small muted">${due.length ? fmt(sum(due, l => l.b)) : ''}</span></div>
      ${due.length ? `<ul class="list" style="margin:0 -16px -16px">${due.map(l => `
        <li class="li" data-a="line" data-k="${k}" data-id="${l.id}"><div class="grow"><div class="t">${esc(l.it.n)}</div><div class="s">${allocChips(l.al) || esc(GMAP[l.g]?.n || '')}</div></div>
        <div class="v">${fmt(l.b)}</div><button class="btn sm" data-a="markpaid" data-k="${k}" data-id="${l.id}">Mark paid</button></li>`).join('')}</ul>`
        : `<p class="muted">Every monthly payment in ${MONTHS[+k.slice(5) - 1]} has an amount against it.</p>`}
    </section>
    <section class="panel">
      <div class="panel-h"><h2>Against your plan</h2>
        <div class="seg">${['1', '2', '3'].map(s => `<button data-a="scen" data-s="${s}" aria-pressed="${s === sid}">${s}</button>`).join('')}</div></div>
      <p class="small muted" style="margin:-4px 0 10px">Scenario ${sid}: ${esc(main().scen?.[sid]?.name || '')}. The tick shows the target share of earned income.</p>
      ${pl.cats.map(c => `<div style="margin-bottom:10px"><div class="row between small"><span>${esc(c.n)}</span>
        <span class="amt"><b class="${c.save ? (c.actPct >= c.planPct ? 'pos' : 'neg') : (c.actPct <= c.planPct ? 'pos' : 'neg')}">${pct(c.actPct)}</b> <span class="muted">of ${pct(c.planPct)}</span></span></div>
        ${hbar(c.actPct, c.planPct, c.save ? 'var(--good)' : (c.actPct > c.planPct ? 'var(--bad)' : 'var(--brand)'))}</div>`).join('')}
      <div class="row between small" style="margin-top:12px"><span class="muted">Net savings rate (after drawdowns)</span><b class="${pl.netRate >= (pl.savePlan / (pl.base || 1)) ? 'pos' : 'neg'}">${pct(pl.netRate, 1)}</b></div>
    </section>
  </div>
  <div class="grid2">
    <section class="panel">
      <div class="panel-h"><h2>Needs a look</h2></div>
      ${checks.length || over.length ? `<ul class="list" style="margin:0 -16px -16px">
        ${checks.length ? `<li class="li" data-a="nav" data-v="accounts"><div class="avatar J">${checks.length}</div><div class="grow"><div class="t">Balances to confirm</div><div class="s">${checks.slice(0, 3).map(r => esc(r.a.n)).join(', ')}${checks.length > 3 ? '…' : ''}</div></div></li>` : ''}
        ${over.map(l => `<li class="li" data-a="line" data-k="${k}" data-id="${l.id}"><div class="grow"><div class="t">${esc(l.it.n)}</div><div class="s">Over budget by ${fmt(l.act - l.b)}</div></div><div class="v neg">${fmt0(l.act)}<small>of ${fmt0(l.b)}</small></div></li>`).join('')}
      </ul>` : '<p class="muted">Nothing over budget and every balance is confirmed.</p>'}
    </section>
    <section class="panel">
      <div class="panel-h"><h2>Latest entries</h2><button class="btn sm ghost" data-a="nav" data-v="budget">See budget</button></div>
      ${recent.length ? `<ul class="list" style="margin:0 -16px -16px">${recent.map(t => txnLi(t, k)).join('')}</ul>` : `<p class="muted">Nothing captured in the app for ${MONTHS[+k.slice(5) - 1]} yet. Tap <b>Add a spend</b> after your next shop.</p>`}
    </section>
  </div>
  <section class="grid2">${['P', 'M'].map(w => personMini(w, k)).join('')}</section>
  </div>`;
}
function txnLi(t, k) {
  const it = cat()[t.it] || { n: '?' };
  const a = t.pay ? accs()[t.pay] : null;
  return `<li class="li" data-a="txn" data-k="${k}" data-id="${t.id}">
    <div class="avatar ${t.by || 'J'}">${t.by ? pname(t.by)[0] : '·'}</div>
    <div class="grow"><div class="t">${esc(t.store || it.n)}</div><div class="s">${esc(t.store ? it.n : (t.note || ''))}${a ? ' · ' + esc(a.n) : ''}</div></div>
    <div class="v ${itemKind(t.it) === 'in' ? 'pos' : ''}">${fmt(t.amt)}<small>${fmtDate(t.d)}</small></div></li>`;
}
function personMini(w, k) {
  const pb = peopleCalc(k, 'b')[w], pa = peopleCalc(k, 'a')[w];
  return `<section class="person ${w}" data-a="nav" data-v="people" style="cursor:pointer">
    <div class="row between"><h3>${esc(pname(w))}</h3><span class="small muted">planned for ${MONTHS[+k.slice(5) - 1]}</span></div>
    <div class="big ${pb.left < 0 ? 'neg' : ''}">${fmt(pb.left)}</div>
    <div class="small muted">${fmt0(pb.inc)} allocated income · ${fmt0(pb.out)} committed</div>
    <div class="small" style="margin-top:6px">So far: ${fmt0(pa.out)} paid out of ${fmt0(pa.inc)} received</div>
  </section>`;
}

/* ---------- BUDGET ---------- */
function viewBudget(k) {
  const mc = monthCalc(k), T = mc.T;
  const isLatest = monthKeys().slice(-1)[0] === k;
  const f = S.ui.bfilter || 'all';
  let lines = mc.lines;
  if (f === 'due') lines = lines.filter(l => l.k !== 'in' && !l.act && (l.b || l.rec));
  if (f === 'over') lines = lines.filter(l => l.k === 'exp' && l.act > l.b + 0.004);
  const col = S.ui.collapsed || (S.ui.collapsed = {});
  const sec = s => {
    const ls = lines.filter(l => l.k === s.k);
    const groups = GROUPS.filter(g => g.sec === s.k);
    const tb = s.k === 'in' ? T.b.earned + T.b.funding : T.b[s.k], ta = s.k === 'in' ? T.a.income : T.a[s.k];
    const autoRows = s.k === 'in' && Object.keys(mc.auto).length ? `<div class="grp"><div class="grp-h"><span class="n">Paid from savings & credit (automatic)</span><span class="num right">–</span><span class="num right">${fmt(T.a.auto)}</span></div>
      ${Object.entries(mc.auto).map(([a, v]) => `<div class="bl" style="cursor:default"><div class="n"><span class="t">From ${esc(accs()[a]?.n || a)}</span><div class="meta"><span class="chip">auto</span></div></div><div class="num faint">–</div><div class="num">${fmt(v)}</div></div>`).join('')}</div>` : '';
    return `<section class="panel flush" style="margin-bottom:14px">
      <div class="sec-h">${s.n}<span class="tot"><span class="muted small">${fmt0(tb)} planned · </span>${fmt0(ta)}</span></div>
      <div class="cols-h"><span>Line item</span><span>Budget</span><span>Actual</span><span class="only-wide">${s.k === 'exp' ? 'Left' : 'Variance'}</span></div>
      ${groups.map(g => {
        const gl = ls.filter(l => l.g === g.k); if (!gl.length) return '';
        const gb = sum(gl, l => l.b), ga = sum(gl, l => l.act), open = col[k + g.k] ? '0' : '1';
        return `<div class="grp" data-open="${open}"><div class="grp-h" data-a="togglegrp" data-g="${k + g.k}"><span class="n">${I.chev}${esc(g.n)}</span><span class="num right">${fmt(gb)}</span><span class="num right">${fmt(ga)}</span><span class="num right only-wide muted">${fmt(s.k === 'exp' ? gb - ga : ga - gb)}</span></div>
          <div class="grp-b">${gl.map(l => lineRow(l, k)).join('')}</div></div>`;
      }).join('')}${autoRows}
      ${!ls.length && !autoRows ? '<div class="empty" style="margin:0 14px 14px">No lines here.</div>' : ''}
    </section>`;
  };
  return `<div>
  <div class="pagehead"><div><h1>${mName(k)} budget</h1><p class="muted">Tap a line to see its entries, change the budget or split it between you.</p></div>
    <div class="row wrap"><button class="btn" data-a="addline" data-k="${k}">${I.plus}Add line</button>
    ${isLatest ? `<button class="btn" data-a="startmonth" data-k="${nextKey(k)}">Start ${MONTHS[+nextKey(k).slice(5) - 1]}</button>` : ''}</div></div>
  <div class="kpis" style="margin-bottom:14px">
    ${[['Money in', T.b.income, T.a.income], ['Saved', T.b.sav, T.a.sav], ['Spent', T.b.exp, T.a.exp], ['Left over', T.b.surplus, T.a.surplus]].map(([n, b, a], i) =>
      `<div class="kpi"><span>${n}</span><b class="${i === 3 ? (a < 0 ? 'neg' : 'pos') : ''}">${fmt(a)}</b><span>Planned ${fmt(b)}</span></div>`).join('')}
  </div>
  <div class="row wrap" style="margin-bottom:12px"><div class="seg">
    ${[['all', 'All lines'], ['due', 'Still to pay'], ['over', 'Over budget']].map(([v, n]) => `<button data-a="bfilter" data-v="${v}" aria-pressed="${f === v}">${n}</button>`).join('')}
  </div></div>
  ${SECTIONS.map(sec).join('')}
  <section class="panel row between"><h2>Left over</h2><div class="right"><div class="amt ${T.a.surplus < 0 ? 'neg' : 'pos'}" style="font-family:var(--font-d);font-size:1.4rem;font-weight:750">${fmt(T.a.surplus)}</div><div class="small muted">Planned ${fmt(T.b.surplus)}</div></div></section>
  </div>`;
}

/* ---------- PEOPLE ---------- */
function viewPeople(k) {
  const basis = S.ui.people || 'b';
  const R = peopleCalc(k, basis);
  const card = w => {
    const r = R[w];
    const inc = r.lines.filter(x => x.l.k === 'in'), out = r.lines.filter(x => x.l.k !== 'in');
    const li = x => `<li class="li" ${x.l.id && !String(x.l.id).startsWith('auto') ? `data-a="line" data-k="${k}" data-id="${x.l.id}"` : ''}><div class="grow"><div class="t">${esc(x.l.it.n)}</div></div><div class="v">${fmt(x.v)}</div></li>`;
    return `<section class="person ${w}">
      <div class="row between"><h2>${w === 'U' ? 'Not allocated yet' : esc(pname(w))}</h2></div>
      ${w !== 'U' ? `<div class="big ${r.left < 0 ? 'neg' : ''}">${fmt(r.left)}</div><div class="small muted">${basis === 'b' ? 'planned surplus' : 'surplus so far'} · ${fmt0(r.inc)} in, ${fmt0(r.out)} out</div>`
        : `<p class="small muted">Lines nobody is assigned to yet. Tap one to split it.</p><div class="small">${fmt0(r.inc)} income · ${fmt0(r.out)} outgoings</div>`}
      ${inc.length ? `<h3 style="margin:14px 0 4px">Income</h3><ul class="list" style="margin:0 -16px">${inc.map(li).join('')}</ul>` : ''}
      ${out.length ? `<h3 style="margin:14px 0 4px">Paying for</h3><ul class="list" style="margin:0 -16px">${out.sort((a, b) => b.v - a.v).map(li).join('')}</ul>` : ''}
    </section>`;
  };
  return `<div>
    <div class="pagehead"><div><h1>Piepie & Munny</h1><p class="muted">All income goes into one pool. Here’s who carries which part of ${mName(k)}.</p></div>

    <div class="grid3">${card('P')}${card('M')}${card('U')}</div>
  </div>`;
}

    <section class="panel flush"><div class="tbl-wrap"><table class="tbl">

      <tbody>${SUMCATS.map(c => {
        const rs = P.rows.filter(r => r.cat === c.k), cc = P.cats.find(x => x.k === c.k);

      <tr class="t"><td>Net savings rate (savings less drawdowns)</td><td>${pct(P.base ? P.savePlan / P.base : 0, 1)}</td><td>${fmt0(P.savePlan)}</td><td>${fmt0(P.net)}</td><td>${pct(P.netRate, 1)}</td><td class="${P.net >= P.savePlan ? 'pos' : 'neg'}">${fmt0(P.net - P.savePlan)}</td><td>${stat(P.net >= P.savePlan ? 'On target' : 'Below target')}</td></tr>

        ${crow('<b>Reserve target</b>', '', `<b>${fmt0(lvTarget)}</b>`)}
        ${crow('Current reserve (from the goal account)', '', `<span class="${lvBal < 0 ? 'neg' : ''}">${fmt0(lvBal)}</span>`)}
        ${crow('Monthly contribution (from emergency + extra bond + escalation)', inp('lavie.fromEmergency', lv.fromEmergency), fmt0(lvMonthly))}

/* ---------- YEAR ---------- */
function barChart(series, labels, opts = {}) {
  const W = 720, H = opts.h || 220, pad = 34, n = labels.length;
  const vals = series.flatMap(s => s.v);
  const max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const y = v => H - pad - (v - min) / (max - min) * (H - pad - 14);
  const bw = (W - pad) / n, gw = bw * 0.72 / series.length;
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'chart')}">`;
  [0, .25, .5, .75, 1].forEach(f => { const v = min + (max - min) * f; out += `<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad - 4}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="var(--faint)">${Math.abs(v) >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v)}</text>`; });
  labels.forEach((l, i) => {
    series.forEach((s, j) => {
      if (s.line) return;
      const v = s.v[i] || 0, x = pad + i * bw + bw * 0.14 + j * gw;
      out += `<rect x="${x}" y="${Math.min(y(v), y(0))}" width="${Math.max(1, gw - 2)}" height="${Math.abs(y(v) - y(0))}" rx="2" fill="${s.c}"><title>${esc(s.n)} ${esc(l)}: ${fmt0(v)}</title></rect>`;
    });
    out += `<text x="${pad + i * bw + bw / 2}" y="${H - 12}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(l)}</text>`;
  });
  series.filter(s => s.line).forEach(s => {
    const pts = s.v.map((v, i) => `${pad + i * bw + bw / 2},${y(v || 0)}`).join(' ');

/* ===================== UI · sheets & actions ===================== */
const sheetStack = [];
function openSheet({ title, body, foot = '', onMount, refresh, wide }) {
  const el = document.createElement('div');
  el.className = 'scrim';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="${wide ? 'max-width:900px' : ''}">
    <div class="sheet-h"><h2>${esc(title)}</h2><button class="btn ghost sm" data-a="closesheet" aria-label="Close">${I.x}</button></div>
    <div class="sheet-b">${body}</div>${foot ? `<div class="sheet-f">${foot}</div>` : ''}</div>`;
  el.addEventListener('mousedown', e => { if (e.target === el) closeSheet(); });
  $('#sheets').appendChild(el);
  const rec = { el, refresh, onMount };
  sheetStack.push(rec);
  onMount && onMount(el);
  setTimeout(() => { const f = el.querySelector('[autofocus]'); f && f.focus(); }, 60);
  return el;
}
function closeSheet() { const s = sheetStack.pop(); if (s) s.el.remove(); }
function closeAll() { while (sheetStack.length) closeSheet(); }
function refreshSheet() { const s = sheetStack[sheetStack.length - 1]; if (s && s.refresh && !s.el.contains(document.activeElement)) s.refresh(s.el); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetStack.length) closeSheet(); });
let toastT;
function toast(msg, cls = '') {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast ' + cls; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2800);
}
const val = (el, sel) => el.querySelector(sel)?.value?.trim() ?? '';
const num = (el, sel) => { const v = parseFloat(String(val(el, sel)).replace(/[^0-9.\-]/g, '')); return isFinite(v) ? v : 0; };

function pickerHTML(q, selected, kinds) {
  q = (q || '').toLowerCase();
  const items = Object.entries(cat()).filter(([, it]) => it && !it.arch && (!kinds || kinds.includes(kindOf(it.g))) && (!q || it.n.toLowerCase().includes(q)));
  let h = '';
  GROUPS.forEach(g => {
    const its = items.filter(([, it]) => it.g === g.k).sort((a, b) => (a[1].o || 0) - (b[1].o || 0));

  return h || '<div class="empty">Nothing matches.</div>';
}
function wirePicker(root, state, kinds, onPick) {
  const box = root.querySelector('.picker'), search = root.querySelector('[data-search]');
  const draw = () => { box.innerHTML = pickerHTML(search.value, state.it, kinds); };
  search.addEventListener('input', draw);
  box.addEventListener('click', e => {

    if (b.dataset.pick) { state.it = b.dataset.pick; draw(); onPick && onPick(state.it); }

      <div class="field"><span class="lab">Paid by</span><div class="seg" id="tx-by">${['P', 'M'].map(w => `<button type="button" data-w="${w}" aria-pressed="${(t.by || S.me) === w}">${esc(pname(w))}</button>`).join('')}</div></div>
      <div class="field"><label for="tx-note">Note</label><input id="tx-note" class="inp" placeholder="Optional" value="${esc(t.note || '')}"></div>
      ${S.assets ? `<div class="field"><label for="tx-rc">Receipt photo</label><input id="tx-rc" type="file" accept="image/*,application/pdf" class="inp">${t.rc ? `<a class="small" href="/_blob/${esc(t.rc)}" target="_blank" rel="noopener">View attached receipt</a>` : ''}</div>` : ''}
      ${t.src === 'import' ? '<p class="small muted">Imported from the 2026 spreadsheet as one monthly total.</p>' : t.src === 'statement' ? '<p class="small muted">Added from a bank statement.</p>' : ''}`,
    foot: `${editing ? '<button class="btn danger" id="tx-del">Delete</button><span class="grow"></span>' : ''}
      ${editing ? '' : '<button class="btn" id="tx-more">Save & add another</button>'}<button class="btn primary" id="tx-save">${editing ? 'Save changes' : 'Save'}</button>`,
    onMount: el => {
      wirePicker(el, st, null, () => el.querySelectorAll('[data-quick]').forEach(q => q.setAttribute('aria-pressed', q.dataset.quick === st.it)));
      el.querySelectorAll('[data-quick]').forEach(b => b.onclick = () => { st.it = b.dataset.quick; el.querySelectorAll('[data-quick]').forEach(q => q.setAttribute('aria-pressed', q === b)); el.querySelector('.picker').innerHTML = pickerHTML(el.querySelector('[data-search]').value, st.it); });
      let by = t.by || S.me || '';
      el.querySelectorAll('#tx-by button').forEach(b => b.onclick = () => { by = b.dataset.w; el.querySelectorAll('#tx-by button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
      const dIn = el.querySelector('#tx-d'), moIn = el.querySelector('#tx-mo');
      dIn.addEventListener('change', () => { const m = mkey(dIn.value); if ([...moIn.options].some(o => o.value === m)) moIn.value = m; });
      const save = async again => {
        const amt = r2(num(el, '#tx-amt'));
        if (!(amt > 0)) return toast('Enter an amount above zero.', 'bad');
        if (!st.it) return toast('Choose what it was for.', 'bad');
        const nt = { d: dIn.value || todayISO(), mo: moIn.value, it: st.it, amt, src: t.src === 'import' ? 'import' : (t.src || 'app'), at: t.at || Date.now() };
        const store = val(el, '#tx-store'), note = val(el, '#tx-note'), pay = val(el, '#tx-pay');
        if (store) nt.store = store; if (note) nt.note = note; if (pay) nt.pay = pay; if (by) nt.by = by;
        if (t.rc) nt.rc = t.rc;
        const f = el.querySelector('#tx-rc')?.files?.[0];
        const btn = el.querySelector('#tx-save'); btn.disabled = true;
        try {
          if (f && S.assets) { try { const r = await S.assets.upload(f); nt.rc = r.id; } catch (e) { toast('Receipt not attached: ' + (e?.message || e?.code), 'bad'); } }
          lsSet('pn_lastpay', pay);
          await saveTxn(nt, id || uid(), editing ? k : null);
          toast(`Saved ${fmt(amt)} to ${cat()[st.it]?.n} · ${mShort(nt.mo)}`);
          if (again) { el.querySelector('#tx-amt').value = ''; el.querySelector('#tx-store').value = ''; el.querySelector('#tx-note').value = ''; el.querySelector('#tx-amt').focus(); btn.disabled = false; }
          else closeSheet();
        } catch (e) { btn.disabled = false; }
      };
      el.querySelector('#tx-save').onclick = () => save(false);
      el.querySelector('#tx-more') && (el.querySelector('#tx-more').onclick = () => save(true));
      el.querySelector('#tx-del') && (el.querySelector('#tx-del').onclick = async () => {
        if (!confirm('Delete this entry?')) return;
        await deleteTxn(k, id); toast('Entry deleted'); closeSheet();
      });
      el.querySelector('#tx-amt').addEventListener('keydown', e => { if (e.key === 'Enter') el.querySelector('[data-search]').focus(); });
    },
  });
}

/* ---------- line detail: budget, split, entries ---------- */
function sheetLine(k, id) {
  const draw = () => {
    const mc = monthCalc(k); const l = mc.lines.find(x => x.id === id) || { id, it: cat()[id] || { n: '?' }, b: 0, act: 0, tx: [], al: [], k: itemKind(id), g: cat()[id]?.g };
    return { l, body: `
      <div class="kpis k3" style="margin-bottom:14px">
        <div class="kpi"><span>Budget</span><b>${fmt(l.b)}</b></div><div class="kpi"><span>Actual</span><b class="${varCls(l)}">${fmt(l.act)}</b></div>
        <div class="kpi"><span>${l.k === 'exp' ? 'Left' : 'Variance'}</span><b class="${(l.k === 'exp' ? l.b - l.act : l.act - l.b) < -0.004 ? 'neg' : ''}">${fmt(l.k === 'exp' ? l.b - l.act : l.act - l.b)}</b></div></div>
      <div class="f2"><div class="field"><label for="ln-b">Budget for ${MONTHS[+k.slice(5) - 1]}</label><input id="ln-b" class="inp num" type="text" inputmode="decimal" value="${l.b || ''}"></div>
        <div class="field" style="justify-content:flex-end"><label class="toggle"><input type="checkbox" id="ln-rec" ${l.rec ? 'checked' : ''}> Every month</label></div></div>
      <div class="lab" style="margin-bottom:6px">Who pays for this</div>
      <div class="quick"><button type="button" data-preset="P">All ${esc(pname('P'))}</button><button type="button" data-preset="M">All ${esc(pname('M'))}</button><button type="button" data-preset="half">50 / 50</button><button type="button" data-preset="none">Not allocated</button></div>
      <div id="ln-splits"></div>
      <button type="button" class="btn sm" id="ln-addsplit">${I.plus}Add a split</button>
      <p class="small muted" id="ln-rem" style="margin:8px 0 12px"></p>
      <div class="field"><label for="ln-note">Notes for ${MONTHS[+k.slice(5) - 1]}</label><textarea id="ln-note" class="inp">${esc(l.note || '')}</textarea></div>
      <div class="row between" style="margin:6px 0"><h3>Entries</h3><button class="btn sm" id="ln-addtx">${I.plus}Add entry</button></div>
      ${l.tx.length ? `<ul class="list panel flush">${l.tx.map(t => txnLi(t, k)).join('')}</ul>` : '<p class="muted small">No entries yet.</p>'}` };
  };
  const { l, body } = draw();
  let splits = (l.al || []).map(x => ({ ...x }));
  openSheet({
    title: l.it.n,
    body,
    foot: `${!l.tx.length && l.inMonth ? '<button class="btn danger" id="ln-rm">Remove from month</button>' : ''}<span class="grow"></span>
      ${l.k !== 'in' && !l.act && l.b ? '<button class="btn" id="ln-paid">Mark paid</button>' : ''}<button class="btn primary" id="ln-save">Save</button>`,
    refresh: el => { const s = el.querySelector('.sheet-b'); const y = s.scrollTop; s.innerHTML = draw().body; mount(el, true); s.scrollTop = y; },
    onMount: el => mount(el),
  });
  function mount(el, again) {
    const box = el.querySelector('#ln-splits'), rem = el.querySelector('#ln-rem');
    const total = () => num(el, '#ln-b') || monthCalc(k).lines.find(x => x.id === id)?.act || 0;
    const drawSplits = () => {
      box.innerHTML = splits.map((s, i) => `<div class="splitrow alloc">
        <select class="inp sm" data-i="${i}" data-f="w" aria-label="Person"><option value="P" ${s.w === 'P' ? 'selected' : ''}>${esc(pname('P'))}</option><option value="M" ${s.w === 'M' ? 'selected' : ''}>${esc(pname('M'))}</option></select>
        <input class="inp sm lbl" data-i="${i}" data-f="lb" placeholder="Label, e.g. Chie’s pocket money" value="${esc(s.lb || '')}" aria-label="Label">
        <input class="inp sm num" data-i="${i}" data-f="v" inputmode="decimal" value="${s.v ?? ''}" aria-label="Amount">
        <button type="button" class="btn sm" data-i="${i}" data-f="u" title="Switch between rand and percent">${s.u === 'pct' ? '%' : 'R'}</button>
        <button type="button" class="btn sm ghost" data-i="${i}" data-f="x" aria-label="Remove split">${I.x}</button></div>`).join('');
      const t = total(); const used = sum(splits, s => s.u === 'pct' ? t * (+s.v || 0) / 100 : +s.v || 0);
      rem.textContent = !splits.length ? 'Not allocated to anyone yet.' : Math.abs(t - used) < 0.01 ? `Fully allocated: ${splits.map(s => pname(s.w) + ' ' + (s.u === 'pct' ? s.v + '%' : fmt(s.v))).join(' · ')}` : `${fmt(t - used)} ${t - used > 0 ? 'not allocated yet' : 'more than the line total'}.`;
    };
    box.oninput = e => { const i = e.target.dataset.i, f = e.target.dataset.f; if (i === undefined) return; splits[i][f] = f === 'v' ? parseFloat(e.target.value) || 0 : e.target.value; if (f !== 'lb') drawSplits(); };
    box.onchange = box.oninput;
    box.onclick = e => { const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i;
      if (b.dataset.f === 'u') { splits[i].u = splits[i].u === 'pct' ? 'amt' : 'pct'; } if (b.dataset.f === 'x') splits.splice(i, 1); drawSplits(); };
    el.querySelector('#ln-addsplit').onclick = () => { const t = total(), used = sum(splits, s => s.u === 'pct' ? t * s.v / 100 : +s.v); splits.push({ w: splits.some(s => s.w === 'P') ? 'M' : 'P', v: r2(Math.max(0, t - used)), u: 'amt' }); drawSplits(); };
    el.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { const p = b.dataset.preset;
      splits = p === 'none' ? [] : p === 'half' ? [{ w: 'P', v: 50, u: 'pct' }, { w: 'M', v: 50, u: 'pct' }] : [{ w: p, v: 100, u: 'pct' }]; drawSplits(); });
    el.querySelector('#ln-b').addEventListener('input', drawSplits);
    drawSplits();
    if (again) return;
    el.querySelector('#ln-save').onclick = async () => {
      const line = { b: r2(num(el, '#ln-b')), al: splits.filter(s => +s.v).map(s => { const o = { w: s.w, v: r2(s.v), u: s.u || 'amt' }; if (s.lb) o.lb = s.lb; return o; }), rec: el.querySelector('#ln-rec').checked, note: val(el, '#ln-note') };
      await saveLine(k, id, line); toast('Saved ' + cat()[id]?.n); closeSheet();
    };
    const pd = el.querySelector('#ln-paid');
    pd && (pd.onclick = () => markPaid(k, id).then(closeSheet));
    const rm = el.querySelector('#ln-rm');
    rm && (rm.onclick = async () => { await removeLine(k, id); toast('Removed from ' + mName(k)); closeSheet(); });
    el.querySelector('#ln-addtx').onclick = () => sheetTxn({ it: id });
    el.querySelector('.sheet-b').addEventListener('click', e => { const li = e.target.closest('[data-a="txn"]'); if (li) { e.stopPropagation(); sheetTxn({ k: li.dataset.k, id: li.dataset.id }); } });
  }
}
async function markPaid(k, id) {
  const l = monthCalc(k).lines.find(x => x.id === id); if (!l) return;
  const d = mkey(todayISO()) === k ? todayISO() : k + '-28';
  const by = l.al?.length === 1 ? l.al[0].w : (S.me || undefined);
  const t = { d, mo: k, it: id, amt: l.b, src: 'app', note: 'Marked paid', at: Date.now() }; if (by) t.by = by;
  await saveTxn(t); toast(`Marked ${l.it.n} paid · ${fmt(l.b)}`);
}
function sheetAddLine(k) {

async function startMonth(nk) {
  const last = monthKeys().slice(-1)[0]; const src = S.months[last];
  if (S.months[nk]) { S.ui.month = nk; render(); return; }
  const lines = {};
  Object.entries(src?.lines || {}).forEach(([id, L]) => {
    if (!L) return; const it = cat()[id]; if (!it || it.arch) return;
    if (!(L.rec || it.rec) && (it.g === 'onceoff' || !(+L.b))) return;
    const n = { b: +L.b || 0 }; if (L.al?.length) n.al = L.al; if (L.rec || it.rec) n.rec = true;
    lines[id] = n;
  });
  openSheet({
    title: 'Start ' + mName(nk),
    body: `<p>This copies ${Object.keys(lines).length} lines from ${mName(last)} – budgets, who pays, and the monthly flags. Once-off lines and lines with no budget are left out.</p>
      <p class="muted small">You can change or remove any line afterwards. Monthly items will show as “Due” until you mark them paid.</p>`,
    foot: `<button class="btn" data-a="closesheet">Cancel</button><button class="btn primary" id="sm-go">Start ${MONTHS[+nk.slice(5) - 1]}</button>`,
    onMount: el => el.querySelector('#sm-go').onclick = async () => {
      await ensureMonth(nk, { lines }); S.ui.month = nk; closeSheet(); toast(mName(nk) + ' is ready'); render();
    },
  });
}
function sheetWho() {
  openSheet({
    title: 'Who’s using this device?',

      <div class="grid2">${['P', 'M'].map(w => `<button class="person ${w}" data-me="${w}" style="text-align:left;cursor:pointer"><div class="big">${esc(pname(w))}</div></button>`).join('')}</div>`,

}

function sheetLedger(accId, entry) {
  const a = accs()[accId], liab = isLiab(a);
  const e = entry || {};
  const dirIn = e.amt === undefined ? true : e.amt >= 0;
  openSheet({
    title: (entry ? 'Edit entry · ' : 'Add entry · ') + a.n,
    body: `<div class="amtbox"><span>R</span><input id="le-amt" inputmode="decimal" placeholder="0.00" value="${e.amt !== undefined ? Math.abs(e.amt) : ''}" autofocus></div>
      <div class="field"><span class="lab">Direction</span><div class="seg" id="le-dir"><button type="button" data-v="1" aria-pressed="${dirIn}">${liab ? 'Owing goes up' : 'Money in'}</button><button type="button" data-v="-1" aria-pressed="${!dirIn}">${liab ? 'Owing goes down' : 'Money out'}</button></div></div>
      <div class="f2"><div class="field"><label for="le-ty">Type</label><select id="le-ty" class="inp">${['deposit', 'withdrawal', 'interest', 'fee', 'spend', 'repayment', 'transfer', 'other'].map(t => `<option ${t === e.ty ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="field"><label for="le-d">Date</label><input id="le-d" class="inp" type="date" value="${e.d || todayISO()}"></div></div>
      <div class="field"><label for="le-ds">Description</label><input id="le-ds" class="inp" value="${esc(e.ds || '')}"></div>
      <p class="small muted">Use this for things the monthly budget doesn’t see: interest, bank fees, money moved in or out outside the budget.</p>`,
    foot: `${entry ? '<button class="btn danger" id="le-del">Delete</button><span class="grow"></span>' : ''}<button class="btn primary" id="le-save">Save</button>`,
    onMount: el => {
      let dir = dirIn ? 1 : -1;
      el.querySelectorAll('#le-dir button').forEach(b => b.onclick = () => { dir = +b.dataset.v; el.querySelectorAll('#le-dir button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
      el.querySelector('#le-save').onclick = async () => {
        const amt = r2(num(el, '#le-amt')); if (!(amt > 0)) return toast('Enter an amount above zero.', 'bad');
        const ne = { d: val(el, '#le-d') || todayISO(), a: accId, amt: dir * amt, ty: val(el, '#le-ty'), ds: val(el, '#le-ds'), src: 'ledger' };
        if (entry && mkey(entry.d) !== mkey(ne.d)) await deleteLedger(mkey(entry.d), entry.id);
        await saveLedger(ne, entry?.id || uid()); toast('Saved'); closeSheet();
      };
      const del = el.querySelector('#le-del');
      del && (del.onclick = async () => { if (!confirm('Delete this entry?')) return; await deleteLedger(mkey(entry.d), entry.id); toast('Deleted'); closeSheet(); });
    },
  });
}

function parseCSV(text) {

    else if (c === '"') q = true;

    else cur += c;

}

  if ((m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{1,2})[-/ ](\d{1,2})[-/ ](\d{4})/))) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{1,2}) ([A-Za-z]{3})[a-z]* (\d{4})/))) { const mi = MONTHS.findIndex(x => x.slice(0, 3).toLowerCase() === m[2].toLowerCase()); if (mi >= 0) return `${m[3]}-${String(mi + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return null;
}

  const h = rows[hi].map(c => String(c).trim());

  const iA = f(/^amount|amount$/i), iDr = f(/debit/i), iCr = f(/credit/i);
